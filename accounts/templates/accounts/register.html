<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/accounts/register.css">
</head>
<body>
{% extends 'health_app/base.html' %}

{% block title %}Registracija | Nekretnine{% endblock %}
    
{% block content %}
<div class="container register-container">
    <div class="register-card">
        <h2 class="text-black">Registracija za Nekretnine</h2>
        <form method="POST" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="first_name" class="form-label">Ime</label>
                <input type="text" class="form-control" id="first_name" name="first_name" required>
            </div>
            <div class="mb-3">
                <label for="last_name" class="form-label">Prezime</label>
                <input type="text" class="form-control" id="last_name" name="last_name" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Korisničko ime</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Lozinka</label>
                <input type="password" class="form-control" id="password1" name="password1" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Potvrdi lozinku</label>
                <input type="password" class="form-control" id="password2" name="password2" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-secondary">Registracija</button>
            </div>
            <div class="mt-3 text-center">
                <a href="{% url 'accounts:login' %}" class="text-muted">Već imate račun? Prijavite se ovdje</a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
