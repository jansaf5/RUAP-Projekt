{% extends 'health_app/base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | Nekretnine</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
    <link rel="stylesheet" href="{% static 'health_app/base.css' %}"> -->

    <style>
        body {
            background: url('/static/img/login-register.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #e8f5e9;
            font-family: 'Arial', sans-serif;
        }
        .login-container {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #000000;
        }
        .btn-primary {
            background-color: #388e3c;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2e7d32;
        }
        .form-control:focus {
            border-color: #66bb6a;
            box-shadow: 0 0 5px rgba(102, 187, 106, 0.5);
        }
    </style>
</head>
<body>

    {% block title %}Prijava | Nekretnine{% endblock %}
    
    {% block content %}
<div class="container login-container">
    <div class="login-card">
        <h2>Prijava u Nekretnine</h2>
        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Korisničko ime</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Lozinka</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-secondary">Prijava</button>
            </div>
            <div class="mt-3 text-center">
                <a href="#" class="text-muted">Zaboravili ste lozinku?</a>
            </div>
            <div class="mt-3 text-center">
                <a href="{% url 'accounts:register' %}" class="text-muted">Nemate račun? Registrirajte se ovdje</a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
