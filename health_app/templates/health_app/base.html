<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plan zdravlja{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/health_app/base.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Nekretnine</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="#navbarNav" aria-expanded="false" aria-label="Prebaci navigaciju">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link " href="{% url 'profile' %}">{{ user.username }}</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link " href="{% url 'home' %}">Početna</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Planovi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Kontakt</a>
                    </li>
                    <li class="nav-item">
                        {% if user.is_authenticated %}
                                <button class="nav-btn logout-btn">
                                    <a href="{% url 'accounts:logout' %}" class="nav-btn">Odjava</a>
                                </button>
                            {% else %}
                            <div class="dropdown profile-dropdown">
                                <button class="nav-btn sign-up-btn">Registracija</button>
                                <div class="dropdown-content">
                                    <a href="{% url 'accounts:register' %}" class="nav-btn">Registracija</a>
                                    <a href="{% url 'accounts:login' %}" class="nav-btn">Prijava</a>
                                </div>
                            </div>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page-specific content -->
    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
